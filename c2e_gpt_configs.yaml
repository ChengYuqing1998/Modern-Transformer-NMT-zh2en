# Decoder-only GPT configuration for Chinese-to-English translation.
wandb_entity: ''
trial_id: gpt-gqa-sink-001
ckpt_file_name: 'c2e_gpt.pt'
log_file_name: 'c2e_gpt.log'

ckpt_dir: './models'
log_dir: './logs'

require_load_model: False
model_load_path: null
model_to_infer_path: null

# Model architecture
model_dim: 512
hidden_dim: 2048
n_layer: 6
n_head: 8

# Component switches for ablation against the classic Transformer decoder.
use_rope: True
use_gqa: True
n_kv_head: 2
use_attention_sink: True
attention_sink_size: 4
use_swiglu: True
use_rms_norm: True
use_pre_norm: True
rope_base: 10000
drop_prob: 0.15

# Data and generation
max_trg_sent_len: 128
refer_max_tensor_len: 32
train_ratio: 0.98
val_ratio: 0.01
batch_size: 100
beam_size: 5
max_new_tokens: 50

pad_token: 0
bos_token: 1
eos_token: 2
unk_token: 3

# Training
max_epochs: 10
learning_rate: 5.0e-4
clip_flag: False
clip_norm: null
optimizer_type: 'adam'
loss_type: 'ce'
ignore_index: 0
smoothing: 0.01

scheduler_flag: True
scheduler_type: 'cosine'
anneal_rate: 0.8
patience: 10
threshold: 0.01
warmup: 5

print_freq: 300
eval_freq: 1
save_freq: 1

device: torch.device("cuda" if torch.cuda.is_available() else "cpu")
random_seed: 0
CUBLAS_WORKSPACE_CONFIG: ':4096:8'
