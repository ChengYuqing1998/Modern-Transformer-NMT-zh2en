# Approximately 100 MiB of model parameters when stored as BF16.
# Exact count with the tracked tokenizers: 51,427,166 parameters,
# 98.09 MiB / 102.85 MB when counting BF16 model weights only.
wandb_mode: 'online'  # options: 'disabled', 'offline', 'online'
wandb_project: 'modern-transformer-zh-en'
wandb_watch_model: True
trial_name: c2e-transformer

ckpt_dir: './checkpoints/encoder_decoder'
resume_from_checkpoint: null
log_dir: './logs'
tokenizer_paths:
  source: './tokenizer/artifacts/source_tokenizer.pkl'
  target: './tokenizer/artifacts/target_tokenizer.pkl'

model_dim: 512
hidden_dim: 2048
n_layer: 5
n_head: 8
drop_prob: 0.15
use_bias: True
use_weight_tying: False

# Keep pairs where len(target_sentence.split()) is at most this value.
max_target_sentence_split_length: 128
# Minimum padded sequence length in tokenizer token IDs; expands if data needs more.
min_sequence_token_length: 32
train_ratio: 0.98
val_ratio: 0.01
batch_size: 96
beam_size: 5
inference_max_new_tokens: 160  # Maximum number of newly generated target token IDs.
inference_use_kv_cache: True  # Cache decoder self-attention and cross-attention K/V.
inference_decoding_strategy: 'beam_search'  # greedy, beam_search, nucleus_sampling
inference_temperature: 0.8
inference_top_p: 0.9
inference_top_k: 0  # 0 disables top-k filtering.
inference_repetition_penalty: 1.0

pad_token: 0
bos_token: 1
eos_token: 2
unk_token: 3

max_epochs: 20
train_precision: 'bf16_mixed'  # options: 'fp32_full', 'bf16_mixed'
checkpoint_precision: 'bf16'  # options: 'fp32', 'bf16'
gradient_accumulation_steps: 1
learning_rate: 5.0e-4
clip_flag: False
clip_norm: null
optimizer_type: 'adam'
loss_type: 'ce'
ignore_index: 0
smoothing: 0.01

scheduler_flag: True
scheduler_type: 'cosine'
anneal_rate: 0.8
patience: 10
threshold: 0.01
warmup: 5

print_every_n_steps: 300
eval_strategy: 'epoch'
eval_interval: 1
save_strategy: 'epoch'
save_interval: 1
save_total_limit: 3  # Maximum checkpoint directories, including the best one.
save_best: True

show_eval_sample: True
eval_sample_sentence: '今天天气很不错，我早餐吃了一个鸡蛋和一杯牛奶。'

device: torch.device("cuda" if torch.cuda.is_available() else "cpu")
random_seed: 0
CUBLAS_WORKSPACE_CONFIG: ':4096:8'
